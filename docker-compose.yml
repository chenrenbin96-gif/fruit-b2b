name: fruit-b2b

services:
  mysql:
    image: mysql:8.0.39
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fruit_b2b}
      MYSQL_USER: ${MYSQL_USER:-fruit_b2b}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_local}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --slow-query-log=ON
      - --long-query-time=${MYSQL_SLOW_QUERY_SECONDS:-1}
      - --slow-query-log-file=/var/lib/mysql/mysql-slow.log
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: 3000
      API_PREFIX: api
      API_VERSION: v1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DATABASE_URL: mysql://${MYSQL_USER:-fruit_b2b}:${MYSQL_PASSWORD:-change_me_local}@mysql:3306/${MYSQL_DATABASE:-fruit_b2b}
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: "fruit-b2b:docker:"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace_with_at_least_32_random_characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace_with_a_different_32_char_secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-2h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      JWT_ISSUER: ${JWT_ISSUER:-fruit-b2b-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fruit-b2b-clients}
      CUSTOMER_SMS_PROVIDER: ${CUSTOMER_SMS_PROVIDER:-console}
      ALLOW_INSECURE_DEV_SMS: "true"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      UPLOAD_DIR: /workspace/uploads
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
    volumes:
      - ./uploads:/workspace/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - frontend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - frontend
      - backend

  backup:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fruit_b2b}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_local}
      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq crond /proc/1/cmdline"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

volumes:
  mysql_data:
  redis_data:

networks:
  frontend:
  backend:
