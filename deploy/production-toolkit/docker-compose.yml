name: fruit-order-production

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  mysql:
    image: mysql:8.0.39
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00", "--slow-query-log=ON", "--long-query-time=1"]
    ports: ["127.0.0.1:${MYSQL_PORT:-13306}:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend]
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
    logging: *default-logging

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      API_PREFIX: api
      API_VERSION: v1
      LOG_LEVEL: info
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-fruit-b2b:production:}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-2h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      JWT_ISSUER: ${JWT_ISSUER:-fruit-b2b-production}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fruit-b2b-clients}
      CUSTOMER_SMS_PROVIDER: ${CUSTOMER_SMS_PROVIDER:?}
      ALLOW_INSECURE_DEV_SMS: ${ALLOW_INSECURE_DEV_SMS:-false}
      SMS_HTTP_ENDPOINT: ${SMS_HTTP_ENDPOINT:-}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-}
      SMS_TEMPLATE_ID: ${SMS_TEMPLATE_ID:-}
      SMS_HTTP_TIMEOUT_MS: ${SMS_HTTP_TIMEOUT_MS:-5000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      UPLOAD_DIR: /workspace/uploads
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
    volumes: ["../../uploads:/workspace/uploads"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [backend]
    logging: *default-logging

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args: { VITE_API_BASE_URL: /api/v1 }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [frontend]
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
      admin: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [frontend, backend]
    logging: *default-logging

  backup:
    build:
      context: ../..
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes: ["${BACKUP_HOST_DIR:-/opt/fruit-order/backups}:/backups"]
    depends_on: { mysql: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "grep -aq crond /proc/1/cmdline"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks: [backend]
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
networks:
  frontend:
  backend:
    internal: true
